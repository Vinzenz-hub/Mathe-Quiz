<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>Zahlen legen</title>
<style>
:root{--bg:#f7f8fa;--ink:#17191f;--muted:#858b98;--line:#e5e7eb;--blue:#315eea;--yellow:#f4bd59;--green:#55b98b;--unit:#76a7f5;--red:#e23b43}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100svh;display:flex;justify-content:center}
main{width:min(920px,100%);padding:clamp(22px,5vw,56px) clamp(16px,4vw,36px) 36px;display:flex;flex-direction:column}
.target{font-size:clamp(88px,22vw,170px);font-weight:850;line-height:1;letter-spacing:-.075em;text-align:center;font-variant-numeric:tabular-nums;margin:4vh 0 5vh;color:#151923}
.workspace{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.zone{min-height:clamp(150px,26vh,230px);background:#fff;border:2px dashed var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;transition:border-color .12s,background .12s}
.zone.over{border-color:var(--blue);background:#f0f4ff}
.zone-head{font-size:13px;font-weight:750;color:var(--muted);letter-spacing:.02em}
.zone-head b{font-size:16px;color:var(--ink);margin-right:5px}
.pieces{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:min-content;align-content:start;justify-items:center;gap:5px 2px;padding:14px 0;flex:1}
.piece{display:block;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.h{width:clamp(25px,3.2vw,34px);height:clamp(25px,3.2vw,34px);border:1px solid #d99b35;border-radius:2px;background-color:var(--yellow);background-image:linear-gradient(#b77d2b66 1px,transparent 1px),linear-gradient(90deg,#b77d2b66 1px,transparent 1px);background-size:10% 10%}
.z{width:clamp(11px,1.7vw,16px);height:clamp(25px,3.2vw,34px);border:1px solid #39956d;border-radius:2px;background:repeating-linear-gradient(0deg,#70c89f 0 8%,#39956d 8% 10%)}
.e{width:clamp(12px,1.8vw,16px);height:clamp(12px,1.8vw,16px);border:1px solid #4d83d5;border-radius:2px;background:var(--unit);align-self:center}
.count{font-size:12px;color:var(--muted);font-weight:650;min-height:17px}
.tray{margin-top:clamp(24px,5vh,44px);padding:16px 18px 19px;border-radius:20px;background:#eceff3;display:flex;justify-content:center;align-items:center;gap:clamp(18px,6vw,54px);touch-action:none}
.source{display:flex;align-items:center;justify-content:center;gap:10px;min-width:70px;min-height:66px;padding:9px 13px;border-radius:14px;background:#fff;box-shadow:0 2px 8px #17233b0b;cursor:grab;touch-action:none;user-select:none}
.source:active{cursor:grabbing}
.source .h{width:32px;height:32px}.source .z{height:32px;width:14px}.source .e{width:14px;height:14px}
.source span:last-child{font-size:14px;font-weight:800}
.drag-ghost{position:fixed;z-index:20;pointer-events:none;opacity:.88;transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 5px 7px #0002)}
.number-entry{display:none;justify-content:center;margin-top:clamp(24px,5vh,44px)}
.number-entry.show{display:flex}
.number-entry input{width:min(260px,70vw);height:62px;border:2px solid var(--line);border-radius:15px;background:#fff;text-align:center;font-size:30px;font-weight:800;color:var(--ink);outline:none}
.number-entry input:focus{border-color:var(--blue)}
.actions{display:flex;justify-content:center;gap:12px;margin-top:16px}
.action{min-height:54px;padding:0 22px;border:0;border-radius:15px;font:750 16px system-ui;cursor:pointer}
.check{background:var(--blue);color:white;box-shadow:0 5px 14px #315eea2b}
.next{background:#17191f;color:white}
.action:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.result{height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:clamp(100px,25vw,190px);font-weight:900;line-height:1;transition:height .15s}
.result.show{height:clamp(115px,27vw,205px)}
.result.good{color:#159b59}.result.bad{color:#e23b43}
main.wrong{animation:shake .34s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media(max-width:520px){.actions{gap:8px}.action{flex:1;padding:0 10px;min-height:52px;font-size:14px}}
@media(max-width:520px){main{padding-top:24px}.target{margin:7vh 0 7vh}.workspace{gap:7px}.zone{min-height:180px;padding:10px 5px;border-radius:15px}.zone-head{font-size:11px}.zone-head b{display:block;font-size:14px;margin:0 0 3px}.pieces{gap:4px 0;padding:12px 0}.h{width:26px;height:26px}.z{width:12px;height:26px}.e{width:12px;height:12px}.tray{gap:9px;padding:12px 8px;border-radius:16px}.source{min-width:0;flex:1;gap:7px;padding:9px 5px;min-height:60px}.source .h{width:29px;height:29px}.source .z{height:29px;width:13px}.source .e{width:13px;height:13px}.source span:last-child{font-size:12px}}
@media(max-width:360px){.workspace{gap:5px}.zone{padding-inline:3px}.pieces{gap:3px 0}.h{width:23px;height:23px}.z{width:11px;height:23px}.e{width:11px;height:11px}.tray{gap:6px}.source{gap:5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="target" id="target" aria-label="Zielzahl">347</div>
  <section class="workspace" aria-label="Arbeitsfläche">
    <div class="zone" data-drop="h"><div class="zone-head"><b>H</b>Hunderter</div><div class="pieces" id="pieces-h"></div></div>
    <div class="zone" data-drop="z"><div class="zone-head"><b>Z</b>Zehner</div><div class="pieces" id="pieces-z"></div></div>
    <div class="zone" data-drop="e"><div class="zone-head"><b>E</b>Einer</div><div class="pieces" id="pieces-e"></div></div>
  </section>
  <section class="tray" id="tray" data-drop="tray" aria-label="Material">
    <div class="source" data-source="h"><i class="piece h"></i><span>100</span></div>
    <div class="source" data-source="z"><i class="piece z"></i><span>10</span></div>
    <div class="source" data-source="e"><i class="piece e"></i><span>1</span></div>
  </section>
  <div class="number-entry" id="numberEntry"><input id="numberAnswer" type="number" min="1" max="999" inputmode="numeric" placeholder="Zahl" aria-label="Zahl eingeben"></div>
  <div class="result" id="result" aria-live="assertive"></div>
  <div class="actions"><button class="action check" id="check">Ergebnis überprüfen</button><button class="action next" id="next" disabled>Nächste Aufgabe</button></div>
  <div class="message" id="message" aria-live="polite"></div>
</main>
<script>
(()=>{
const targetEl=document.getElementById('target'),message=document.getElementById('message');
const main=document.querySelector('main'),result=document.getElementById('result');
const checkButton=document.getElementById('check'),nextButton=document.getElementById('next');
let solved=false,audioContext=null,mode='build';
const counts={h:0,z:0,e:0};let target=347,drag=null,ghost=null;
const values={h:100,z:10,e:1},labels={h:'Hunderter',z:'Zehner',e:'Einer'};
function newNumber(){
 solved=false;mode=Math.random()<.34?'read':'build';
 document.getElementById('numberAnswer').value='';
 checkButton.disabled=false;nextButton.disabled=true;
 result.className='result';result.textContent='';message.textContent='';
 let n;do{n=Math.floor(Math.random()*999)+1}while(n===target);
 target=n;
 for(const k of Object.keys(counts)){counts[k]=0}
 if(mode==='read'){
  const digits={h:Math.floor(n/100),z:Math.floor((n%100)/10),e:n%10};
  for(const k of Object.keys(counts))counts[k]=digits[k];
  targetEl.textContent='?';targetEl.setAttribute('aria-label','Gesuchte Zahl');
  document.getElementById('tray').style.display='none';
  document.getElementById('numberEntry').classList.add('show');
 }else{
  targetEl.textContent=String(n);targetEl.setAttribute('aria-label','Zielzahl');
  document.getElementById('tray').style.display='flex';
  document.getElementById('numberEntry').classList.remove('show');
  document.getElementById('numberAnswer').value='';
 }
 for(const k of Object.keys(counts))render(k);
}
function render(k){
 const area=document.getElementById('pieces-'+k);area.replaceChildren();
 for(let i=0;i<counts[k];i++){
  const block=document.createElement('i');block.className='piece '+k;block.dataset.placed=k;block.dataset.index=String(i);block.setAttribute('aria-label',labels[k]);
  area.append(block);
 }
}
function currentValue(){return counts.h*100+counts.z*10+counts.e}
function playTone(correct){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;
  audioContext=audioContext||new AudioCtx();if(audioContext.state==='suspended')audioContext.resume();
  const now=audioContext.currentTime,notes=correct?[660,880]:[220,165];
  notes.forEach((freq,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();
   osc.type=correct?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+i*.13);
   gain.gain.setValueAtTime(.0001,now+i*.13);gain.gain.exponentialRampToValueAtTime(.16,now+i*.13+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.19);
   osc.connect(gain);gain.connect(audioContext.destination);osc.start(now+i*.13);osc.stop(now+i*.13+.2);
  });
 }catch(e){}
}
function verify(){
 if(solved)return;
 const entered=document.getElementById('numberAnswer').value;
 if(mode==='read'&&(entered===''||Number(entered)<1||Number(entered)>999)){message.textContent='Bitte eine Zahl eingeben';return}
 const correct=(mode==='read'?Number(entered):currentValue())===target;result.className='result show '+(correct?'good':'bad');result.textContent=correct?'✓':'✕';
 if(correct){solved=true;message.textContent='';checkButton.disabled=true;nextButton.disabled=false;playTone(true);}
 else{message.textContent='Noch nicht richtig';if(navigator.vibrate)navigator.vibrate([120,60,120]);main.classList.remove('wrong');void main.offsetWidth;main.classList.add('wrong');playTone(false);}
}
checkButton.addEventListener('click',verify);
nextButton.addEventListener('click',()=>{if(solved)newNumber()});
document.getElementById('numberAnswer').addEventListener('input',()=>{if(!solved){result.className='result';result.textContent='';message.textContent=''}});
function point(e){return {x:e.clientX,y:e.clientY}}
function start(e,kind,from){
 if(mode!=='build'||solved)return;
 if(e.button!==undefined&&e.button!==0)return;
 e.preventDefault();
 const p=point(e);drag={kind,from,startX:p.x,startY:p.y,moved:false};
 const g=document.createElement('i');g.className='piece '+kind+' drag-ghost';g.style.left=p.x+'px';g.style.top=p.y+'px';document.body.append(g);ghost=g;
 document.addEventListener('pointermove',move,{passive:false});
 document.addEventListener('pointerup',end);
 document.addEventListener('pointercancel',cancel);
}
function move(e){
 if(!drag)return;e.preventDefault();const p=point(e);
 if(Math.hypot(p.x-drag.startX,p.y-drag.startY)>5)drag.moved=true;
 if(ghost){ghost.style.left=p.x+'px';ghost.style.top=p.y+'px'}
 document.querySelectorAll('.zone').forEach(z=>z.classList.remove('over'));
 const el=document.elementFromPoint(p.x,p.y)?.closest('.zone');
 if(el)el.classList.add('over');
}
function cleanup(){
 document.removeEventListener('pointermove',move);
 document.removeEventListener('pointerup',end);
 document.removeEventListener('pointercancel',cancel);
 document.querySelectorAll('.zone').forEach(z=>z.classList.remove('over'));
 ghost?.remove();ghost=null;drag=null;
}
function end(e){
 if(!drag)return;const p=point(e),d=drag,under=document.elementFromPoint(p.x,p.y);
 const zone=under?.closest('[data-drop]');cleanup();
 if(!d.moved||!zone||solved)return;
 if(d.from==='tray'){
  const k=zone.dataset.drop;
  if(k!==d.kind||counts[k]>=9)return;
  counts[k]++;render(k);result.className='result';result.textContent='';message.textContent='';
 }else if(zone.dataset.drop==='tray'){
  counts[d.kind]=Math.max(0,counts[d.kind]-1);render(d.kind);result.className='result';result.textContent='';message.textContent='';
 }
}
function cancel(){cleanup()}
document.querySelectorAll('[data-source]').forEach(el=>el.addEventListener('pointerdown',e=>start(e,el.dataset.source,'tray')));
document.querySelectorAll('.pieces').forEach(el=>el.addEventListener('pointerdown',e=>{
 const block=e.target.closest('[data-placed]');if(block)start(e,block.dataset.placed,'workspace');
}));
newNumber();
})();
</script>
</body>
</html>
